name: Build and deploy phpBB

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout volledige Git geschiedenis
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. PHP + Composer
      # --------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Verify build
        run: |
          test -d vendor
          test -f vendor/autoload.php
          echo "Build succesvol"

      # --------------------------------------------------
      # 3. Bepaal gewijzigde en verwijderde bestanden
      # --------------------------------------------------
      - name: Determine changed files
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          git diff --name-status "$BEFORE" "$AFTER" > /tmp/changes.txt

          echo
          echo "Git wijzigingen:"
          cat /tmp/changes.txt

      # --------------------------------------------------
      # 4. Controleer root Composer wijzigingen
      # --------------------------------------------------
      - name: Check root Composer changes
        id: composer
        run: |
          if grep -Eq '^[ACMRT][[:space:]]+(composer\.json|composer\.lock)$' /tmp/changes.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Root Composer gewijzigd."
            echo "Volledige vendor/ wordt gedeployed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Root Composer niet gewijzigd."
          fi

      # --------------------------------------------------
      # 5. Controleer DEPLOY_DELETE in gekoppelde PR
      # --------------------------------------------------
      - name: Check delete authorization
        id: delete_auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          PR_BODY=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REPO/commits/$SHA/pulls" \
            | jq -r '.[0].body // ""')

          if printf '%s' "$PR_BODY" | grep -q 'DEPLOY_DELETE'; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_DELETE gevonden."
            echo "Verwijderen van bestanden is toegestaan."
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_DELETE niet gevonden."
            echo "Bestanden worden NIET automatisch verwijderd."
          fi

      # --------------------------------------------------
      # 6. Installeer SFTP client
      # --------------------------------------------------
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # --------------------------------------------------
      # 7. Maak deploypakket
      # --------------------------------------------------
      - name: Prepare deploy package
        env:
          COMPOSER_CHANGED: ${{ steps.composer.outputs.changed }}
        run: |

          rm -rf /tmp/deploy
          mkdir -p /tmp/deploy

          # Zorg ervoor dat dit bestand altijd schoon begint.
          : > /tmp/deleted-files.txt

          while IFS=$'\t' read -r status file extra; do

            # ----------------------------------------------
            # Verwijderde bestanden bewaren voor later
            # ----------------------------------------------
            if [ "$status" = "D" ]; then
              echo "$file" >> /tmp/deleted-files.txt
              echo "DELETE: $file"
              continue
            fi

            # ----------------------------------------------
            # Runtime/config bestanden nooit deployen
            # ----------------------------------------------
            case "$file" in
              .env|.env.*)
                echo "SKIP environment: $file"
                continue
                ;;
              cache/*|files/*|store/*)
                echo "SKIP runtime: $file"
                continue
                ;;
              .github/*)
                echo "SKIP GitHub: $file"
                continue
                ;;
            esac

            # ----------------------------------------------
            # Alleen bestaande bestanden
            # ----------------------------------------------
            if [ -f "$file" ]; then
              mkdir -p "/tmp/deploy/$(dirname "$file")"
              cp "$file" "/tmp/deploy/$file"
              echo "ADD: $file"
            fi

          done < /tmp/changes.txt

          # ----------------------------------------------
          # Root Composer gewijzigd:
          # volledige opgebouwde vendor deployen
          # ----------------------------------------------
          if [ "$COMPOSER_CHANGED" = "true" ]; then

            echo
            echo "Root Composer gewijzigd."
            echo "Volledige vendor/ toevoegen aan deploypakket."

            mkdir -p /tmp/deploy/vendor
            cp -a vendor/. /tmp/deploy/vendor/

          fi

          echo
          echo "======================================"
          echo "Deploypakket:"
          echo "======================================"

          if find /tmp/deploy -type f -print -quit | grep -q .; then
            find /tmp/deploy -type f | sort
          else
            echo "Geen bestanden."
          fi

          echo
          echo "======================================"
          echo "Te verwijderen:"
          echo "======================================"

          if [ -s /tmp/deleted-files.txt ]; then
            cat /tmp/deleted-files.txt
          else
            echo "Geen verwijderde bestanden."
          fi

      # --------------------------------------------------
      # 8. Upload alle bestanden via ÉÉN SFTP sessie
      # --------------------------------------------------
      - name: Deploy changed files
        env:
          SFTP_HOST: ${{ secrets.ONECOM_HOST }}
          SFTP_USER: ${{ secrets.ONECOM_USER }}
          SSHPASS: ${{ secrets.ONECOM_PASSWORD }}
        run: |

          if ! find /tmp/deploy -type f -print -quit | grep -q .; then
            echo "Geen bestanden om te deployen."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          local_root = Path("/tmp/deploy")
          remote_root = "/customers/e/a/c/doctorwhofans.be/httpd.www/forum"

          files = sorted(
              p.relative_to(local_root).as_posix()
              for p in local_root.rglob("*")
              if p.is_file()
          )

          commands = []
          created_dirs = set()

          for file in files:

              path = Path(file)

              # Veiligheidscontrole
              if file.startswith("/") or ".." in path.parts:
                  print(f"SKIP unsafe path: {file}")
                  continue

              # Maak alle benodigde directories aan.
              # - voor mkdir = fout negeren als directory al bestaat.
              current = remote_root

              for part in path.parent.parts:

                  if part in ("", "."):
                      continue

                  current = f"{current}/{part}"

                  if current not in created_dirs:
                      commands.append(f'-mkdir "{current}"')
                      created_dirs.add(current)

              remote = f"{remote_root}/{file}"
              local = local_root / file

              commands.append(
                  f'put "{local}" "{remote}"'
              )

          commands.append("bye")

          Path("/tmp/sftp-upload.txt").write_text(
              "\n".join(commands) + "\n"
          )

          print(f"Prepared {len(files)} files for upload.")
          PY

          echo
          echo "======================================"
          echo "Testing SFTP authentication..."
          echo "======================================"

          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P 22 \
            "$SFTP_USER@$SFTP_HOST" <<'EOF'
          pwd
          bye
          EOF

          echo
          echo "======================================"
          echo "Starting single SFTP upload session..."
          echo "======================================"

          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P 22 \
            -b /tmp/sftp-upload.txt \
            "$SFTP_USER@$SFTP_HOST"

      # --------------------------------------------------
      # 9. Verwijder bestanden indien DEPLOY_DELETE aanwezig
      # --------------------------------------------------
      - name: Delete removed files
        if: steps.delete_auth.outputs.authorized == 'true'
        env:
          SFTP_HOST: ${{ secrets.ONECOM_HOST }}
          SFTP_USER: ${{ secrets.ONECOM_USER }}
          SSHPASS: ${{ secrets.ONECOM_PASSWORD }}
        run: |

          if [ ! -s /tmp/deleted-files.txt ]; then
            echo "Geen verwijderde bestanden."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          remote_root = "/customers/e/a/c/doctorwhofans.be/httpd.www/forum"

          files = Path(
              "/tmp/deleted-files.txt"
          ).read_text().splitlines()

          commands = []

          for file in files:

              file = file.strip()

              if not file:
                  continue

              path = Path(file)

              # Extra veiligheidscontrole
              if file.startswith("/") or ".." in path.parts:
                  print(f"SKIP unsafe deletion: {file}")
                  continue

              remote = f"{remote_root}/{file}"

              # - voor rm = fout negeren als bestand al verdwenen is.
              commands.append(
                  f'-rm "{remote}"'
              )

          commands.append("bye")

          Path("/tmp/sftp-delete.txt").write_text(
              "\n".join(commands) + "\n"
          )
          PY

          echo
          echo "======================================"
          echo "Deleting authorized files..."
          echo "======================================"

          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P 22 \
            -b /tmp/sftp-delete.txt \
            "$SFTP_USER@$SFTP_HOST"

      # --------------------------------------------------
      # 10. Geen delete-autorisatie:
      # maak rapport op one.com
      # --------------------------------------------------
      - name: Upload deletion report
        if: steps.delete_auth.outputs.authorized == 'false'
        env:
          SFTP_HOST: ${{ secrets.ONECOM_HOST }}
          SFTP_USER: ${{ secrets.ONECOM_USER }}
          SSHPASS: ${{ secrets.ONECOM_PASSWORD }}
        run: |

          if [ ! -s /tmp/deleted-files.txt ]; then
            echo "Geen verwijderde bestanden."
            exit 0
          fi

          echo "DEPLOY_DELETE ontbreekt."
          echo "Verwijderde bestanden worden niet verwijderd."

          cp /tmp/deleted-files.txt \
            /tmp/DEPLOY_DELETIONS.txt

          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P 22 \
            "$SFTP_USER@$SFTP_HOST" <<'EOF'
          cd /customers/e/a/c/doctorwhofans.be/httpd.www/forum
          put /tmp/DEPLOY_DELETIONS.txt DEPLOY_DELETIONS.txt
          bye
          EOF

      # --------------------------------------------------
      # 11. Samenvatting
      # --------------------------------------------------
      - name: Deployment complete
        run: |

          echo
          echo "======================================"
          echo "Deployment succesvol"
          echo "======================================"

          echo "Commit:"
          echo "$GITHUB_SHA"

          echo
          echo "Root Composer gewijzigd:"
          echo "${{ steps.composer.outputs.changed }}"

          echo
          echo "Delete geautoriseerd:"
          echo "${{ steps.delete_auth.outputs.authorized }}"

          echo
          echo "======================================"