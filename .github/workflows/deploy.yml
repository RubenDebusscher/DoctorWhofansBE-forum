name: Test one.com SFTP

on:
  push:
    branches:
      - main

jobs:
  test-sftp:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Test SFTP connection
        env:
          SFTP_HOST: ${{ secrets.ONECOM_HOST }}
          SFTP_USER: ${{ secrets.ONECOM_USER }}
          SFTP_PASSWORD: ${{ secrets.ONECOM_PASSWORD }}
        run: |
          sshpass -p "$SFTP_PASSWORD" sftp \
            -o StrictHostKeyChecking=no \
            -P 22 \
            "$SFTP_USER@$SFTP_HOST" <<'EOF'
          pwd
          ls -la
          cd forum
          pwd
          ls -la
          bye
          EOF