name: Test one.com SFTP

on:
  push:
    branches:
      - main

jobs:
  test-sftp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload test file
        env:
          SFTP_HOST: ${{ secrets.ONECOM_HOST }}
          SFTP_USER: ${{ secrets.ONECOM_USER }}
          SFTP_PASSWORD: ${{ secrets.ONECOM_PASSWORD }}
        run: |
          sshpass -p "$SFTP_PASSWORD" sftp \
            -o StrictHostKeyChecking=no \
            -P 22 \
            "$SFTP_USER@$SFTP_HOST" <<'EOF'
          cd /customers/e/a/c/doctorwhofans.be/httpd.www/forum
          put deploy-test.txt
          bye
          EOF